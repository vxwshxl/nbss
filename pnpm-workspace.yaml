# The workspace. Three members, and the split is deliberate:
#
#   apps/web      the Next.js site and operations console
#   apps/mobile   the Expo app guards and clients carry
#   packages/*    code both of them must agree on — generated database types,
#                 the employee-code identity rules, geofence maths, SOS shapes
#
# Anything that decides something (a fence verdict, a worked-minute total) lives
# in Postgres, not here. `packages/shared` is for the vocabulary two clients
# need in common, not for business rules that would then exist in two places.
packages:
  - apps/*
  - packages/*

# Expo's Metro bundler cannot follow pnpm's symlinked store for these, so they
# are hoisted into a flat node_modules the way React Native expects.
publicHoistPattern:
  - "*eslint*"
  - "*react-native*"
  - "expo*"
  - "@expo/*"
  - "@react-native/*"
  - "metro*"

onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - esbuild

# One copy of React's types for the whole workspace. Two copies (the app on
# 19.3 for Expo SDK 58, the site's dependencies on 19.2) make every class
# component from a library "not a valid JSX component" in whichever app sees
# the other copy.
overrides:
  "@types/react": ~19.3.0
