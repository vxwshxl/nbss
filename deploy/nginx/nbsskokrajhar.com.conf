# nbsskokrajhar.com — Next.js on 127.0.0.1:3040. Cloudflare proxies the zone (Full strict);
# the origin certificate is Let's Encrypt via webroot /var/www/letsencrypt.

upstream nbss_app { server 127.0.0.1:3040; keepalive 16; }

server {
    listen 80;
    server_name nbsskokrajhar.com www.nbsskokrajhar.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://nbsskokrajhar.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nbsskokrajhar.com www.nbsskokrajhar.com;

    ssl_certificate     /etc/letsencrypt/live/nbsskokrajhar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nbsskokrajhar.com/privkey.pem;

    if ($host = www.nbsskokrajhar.com) { return 301 https://nbsskokrajhar.com$request_uri; }

    # Check-in selfies and documents go through server actions.
    client_max_body_size 30m;
    # Supabase session cookies are chunked into several Set-Cookie headers (~4–8 KB);
    # nginx's default 4 KB header buffer turns a successful sign-in into a 502.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location /_next/static/ {
        proxy_pass http://nbss_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nbss_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # Nibo's chat streams; don't hold the answer back until it is complete.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
