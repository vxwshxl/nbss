<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="NBSS — National Bodo Security Services">
  <defs>
    <!-- The Aronai: a woven band of nested diamonds, the motif the whole
         identity is drawn from. Tiled here exactly as the site renders it. -->
    <pattern id="aronai" width="36" height="12" patternUnits="userSpaceOnUse">
      <rect width="36" height="12" fill="#04120C"/>
      <path d="M0 .5h36M0 11.5h36" stroke="#0B4830" stroke-width="1"/>
      <path d="M9 1.6 13.6 6 9 10.4 4.4 6Z" fill="none" stroke="#E2A93C" stroke-width="1.15"/>
      <path d="M27 1.6 31.6 6 27 10.4 22.4 6Z" fill="none" stroke="#19A96E" stroke-width="1.15"/>
      <path d="M18 3.4 20.6 6 18 8.6 15.4 6Z" fill="#D45A3A"/>
      <path d="M0 3.4 2.6 6 0 8.6Z" fill="#D45A3A"/>
      <path d="M36 3.4 33.4 6 36 8.6Z" fill="#D45A3A"/>
    </pattern>

    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A100D"/>
      <stop offset="55%" stop-color="#0C1512"/>
      <stop offset="100%" stop-color="#04120C"/>
    </linearGradient>

    <radialGradient id="glow" cx="18%" cy="105%" r="70%">
      <stop offset="0%" stop-color="#0B4830" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0B4830" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2C669"/>
      <stop offset="50%" stop-color="#E2A93C"/>
      <stop offset="100%" stop-color="#33D492"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#field)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- Aronai rules, top and bottom -->
  <rect x="0" y="0" width="1200" height="12" fill="url(#aronai)"/>
  <rect x="0" y="408" width="1200" height="12" fill="url(#aronai)"/>

  <!-- Shield mark -->
  <g transform="translate(112 128) scale(3.05)">
    <path d="M22 2 4 8v16.5C4 35.6 11.6 43.7 22 46c10.4-2.3 18-10.4 18-21.5V8L22 2Z"
          fill="none" stroke="#19A96E" stroke-width="2.4"/>
    <path d="M22 12.5 27.5 19 22 25.5 16.5 19Z" fill="#E2A93C"/>
    <path d="M22 26 26 30.5 22 35 18 30.5Z" fill="#D45A3A"/>
    <path d="M12 21.5h4M28 21.5h4" stroke="#33D492" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="312" y="188"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="118" font-weight="700" letter-spacing="-4"
        fill="#ECF2ED">NBSS</text>

  <text x="318" y="230"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="19" letter-spacing="7.5"
        fill="#8FA396">NATIONAL BODO SECURITY SERVICES</text>

  <!-- Rule + tagline -->
  <rect x="318" y="262" width="86" height="2" fill="#C8912F"/>
  <text x="318" y="308"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="31" font-weight="700" letter-spacing="-.8"
        fill="url(#gold)">Trained in Bodoland. Trusted across the Northeast.</text>

  <text x="318" y="348"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="15.5" letter-spacing="3.4"
        fill="#728578">KOKRAJHAR · BODOLAND TERRITORIAL REGION · ASSAM</text>

  <!-- Stack badge, right -->
  <g transform="translate(1052 190)" text-anchor="middle">
    <rect x="-88" y="-44" width="176" height="34" rx="3" fill="none" stroke="#21362D"/>
    <text y="-21" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="15" letter-spacing="3" fill="#33D492">NEXT.JS 15</text>

    <rect x="-88" y="0" width="176" height="34" rx="3" fill="none" stroke="#21362D"/>
    <text y="23" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="15" letter-spacing="3" fill="#E2A93C">REACT 19</text>

    <rect x="-88" y="44" width="176" height="34" rx="3" fill="none" stroke="#21362D"/>
    <text y="67" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="15" letter-spacing="3" fill="#A9BCAF">TYPESCRIPT</text>
  </g>
</svg>
